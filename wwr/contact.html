<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Wild River Adventures</title>
  <meta name="description"
    content="You can contact us to learn more about our services or to have any questions answered. Feel free to ask for a quote and inquire about our available packages.">
  <meta name="author" content="Marisol Torres Lugo">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
  <header>
    <img class="logo" src="images/logo.png" alt="Whitewater Rafting logo" width="100">
    <nav>
      <ul class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main class="contact">
    <div class="company-information">
      <h1>Wild River Adventures</h1>

      <p>Av. Álvaro Obregón 168, Roma Nte., Cuauhtémoc, 06700</p>
      <p>Ciudad de México, CDMX</p>
      <p>+52 55 1234 5678</p>
      <p>info@wildriveradventures.com</p>
    </div>

    <section class="contact-form">
      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3762.882701737523!2d-99.16484012426906!3d19.41747344116272!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d202eb6574a2cb%3A0x2c7abaad7fb3d16a!2sHuasteca%20Adventure!5e0!3m2!1ses-419!2smx!4v1791659696058!5m2!1ses-419!2smx"
          width="450" height="450" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div class="box">
        <form>
          <div class="row">
            <label for="fullname" class="col-1">Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Name" class="col-2">
          </div>

          <div class="row">
            <label for="email" class="col-1">Email</label>
            <input type="text" id="email" name="email" placeholder="e-mail" class="col-2">
          </div>

          <div class="row">
            <label for="message" class="col-1">Message Purpose</label>
            <div>
              <div class="options-message">
                <div>
                  <input type="radio" id="general" name="contact" value="general">
                  <label for="general">General Inquiry</label>
                </div>
                <div>
                  <input type="radio" id="reservation" name="contact" value="reservation">
                  <label for="reservation">Reservation Question</label>
                </div>
                <div>
                  <input type="radio" id="website" name="contact" value="website">
                  <label for="website">Website Suggestion</label>
                </div>
              </div>
            </div>
          </div>

          <div class="row-column">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4"></textarea>
          </div>

          <div class="row">
            <div>
              <input type="checkbox" id="subscribe" name="subscribe" value="subscribe">
              <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
            </div>

          </div>
          <button type="submit">Get in touch!</button>

        </form>
      </div>
    </section>


    <section class="employees">
      <h2>We Are Here to Serve You</h2>
      <div class="image-container">
        <figure>
          <img src="images/manuel-silverio.webp" alt="Manuel Silverio Manager">
          <figcaption class="img-caption">Manuel Silverio</figcaption>
        </figure>
        <figure>
          <img src="images/isabela-mondragon.webp" alt="Isabela Mondragon Supervisor">
          <figcaption class="img-caption">Isabela Mondragon</figcaption>
        </figure>
        <figure>
          <img src="images/angel-covarrubias.webp" alt="Angel Covarrubias Guide">
          <figcaption class="img-caption">Angel Covarrubias</figcaption>
        </figure>

      </div>
    </section>

  </main>


  <footer>
    <p class="col-1">&copy;2026 | Wild River Adventures | Marisol Torres Lugo</p>
    <nav class="socialmedia col-2">
      <a href="https://www.facebook.com/"><img src="images/facebook.webp" alt="Facebook icon"
          height="40"></a>
      <a href="https://www.youtube.com/"><img src="images/youtube.png" alt="Youtube icon"
          height="40"></a>
      <a href="https://www.tiktok.com/"><img src="images/tiktok.webp" alt="Tiktok icon"
          height="40"></a>
    </nav>
  </footer>


</body>

</html>
